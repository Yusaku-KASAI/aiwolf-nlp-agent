services:
  agent:
    build: .
    image: aiwolf-nlp-agent:latest
    depends_on:
      - server
    volumes:
      - .:/app  # ローカルのコードをコンテナの /app に同期
      - /app/.venv  # コンテナ内の仮想環境を永続化
    environment:
      - PYTHONUNBUFFERED=1
    restart: on-failure
    tty: true

  server:
    build: ../aiwolf-nlp-server
    image: aiwolf-nlp-server:latest
    container_name: aiwolf-nlp-server
    ports:
      - "8080:8080"
    # READMEにある .env ファイルを読み込む設定
    env_file:
      - ../aiwolf-nlp-server/config/.env
    volumes:
      - ../aiwolf-nlp-server/logs:/root/logs
    restart: always
    environment:
      - TZ=Asia/Tokyo

  claude:
    build:
      context: .
      dockerfile: ./Dockerfile.claude
    container_name: claude-dev-shell
    volumes:
      - ../:/home/claude/workspace
      # 補足: Claudeコンテナ側でも aiwolf-nlp-agent/.venv は見えますが、
      # UV_PROJECT_ENVIRONMENT の設定により、Claudeは /opt/claude_venv を優先します。
    working_dir: /home/claude/workspace/aiwolf-nlp-agent
    environment:
      - TZ=Asia/Tokyo
    tty: true
    stdin_open: true # インタラクティブな操作に必要
